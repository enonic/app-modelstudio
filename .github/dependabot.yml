version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    assignees:
      - "rymsha"
    reviewers:
      - "rymsha"
  - package-ecosystem: "npm"
    directory: "/"
    # Keep in sync with minimumReleaseAge/minimumReleaseAgeExclude in
    # pnpm-workspace.yaml: Dependabot must not propose versions pnpm would reject,
    # and must not hold back the first-party packages pnpm lets through.
    cooldown:
      default-days: 3
      exclude:
        - "@enonic/*"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    assignees:
      - "alansemenov"
    reviewers:
      - "alansemenov"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 10
    assignees:
      - "rymsha"
    reviewers:
      - "rymsha"
