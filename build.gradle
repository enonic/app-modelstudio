plugins {
    id 'java'
    id 'maven-publish'
    id 'com.enonic.defaults' version '2.1.7'
    id 'com.enonic.xp.app'
    id 'com.github.node-gradle.node' version '7.1.0'
}

configurations {
    devResources {
        attributes {
            attribute(LibraryElements.LIBRARY_ELEMENTS_ATTRIBUTE, objects.named(LibraryElements, 'dev-resources'))
        }
    }
}

dependencies {
    implementation xplibs.api.jaxrs
    implementation xplibs.api.core
    implementation xplibs.api.portal
    implementation xplibs.api.script
    include xplibs.admin
    include xplibs.portal
    include xplibs.schema
    include xplibs.app
    include xplibs.i18n
    include xplibs.event
    include libs.lib.admin.ui
    devResources libs.lib.admin.ui
    include libs.lib.asset
    include libs.lib.graphql
    include libs.lib.mustache

    testImplementation "com.enonic.xp:testing:${xpVersion}"
    testImplementation(platform("org.junit:junit-bom:5.12.2"))
    testImplementation(platform("org.mockito:mockito-bom:5.17.0"))
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.mockito:mockito-junit-jupiter'
    testImplementation( testFixtures( "com.enonic.xp:jaxrs-impl:${xpVersion}" ) )
}

configurations.all {
    resolutionStrategy.cacheChangingModulesFor 0, 'seconds'
}

repositories {
    mavenLocal()
    mavenCentral()
    xp.enonicRepo('dev')
}

node {
    download = true
    version = '24.21.0'
    pnpmVersion = '10.33.4'
}

task copyDevResources {
    doLast {
        copy {
            from configurations.devResources.files.collect { zipTree( it ) }
            include 'dev/**'
            into '.xp'
        }
    }
}

tasks.named( 'pnpmInstall' ).configure {
    dependsOn copyDevResources
    if ( System.getenv( 'CI' ) == 'true' || project.hasProperty( 'ci' ) ) {
        pnpmCommand.set( ['install', '--no-frozen-lockfile'] )
    }
}

task flush( type: Delete, dependsOn: clean ) {
    description = 'Clean the project from built sources and dependencies'
    delete '.xp'
}

task cleanNode( type: Delete ) {
    delete 'node_modules'
}

task checkTypes( type: PnpmTask, dependsOn: pnpmInstall ) {
    group = 'verification'
    args = [ 'run', 'check:types' ]
    outputs.upToDateWhen { false }
}

task lint( type: PnpmTask, dependsOn: pnpmInstall ) {
    group = 'verification'
    args = [ 'run', 'check:lint' ]
    outputs.upToDateWhen { false }
}

task pnpmBuild( type: PnpmTask, dependsOn: [pnpmInstall, lint, checkTypes] ) {
    environment = [ 'NODE_ENV': nodeEnvironment() ]
    description = 'Build UI resources (ts, css, etc) with Vite.'
    args = [ 'run', nodeEnvironment() == 'production' ? 'build:prod' : 'build' ]
    inputs.dir '.xp/dev'
    inputs.dir 'src/main'
    inputs.file 'vite.config.ts'
    outputs.dir "${buildDir}/resources/main/assets"
}

jar {
    exclude 'assets/**/*.ts'
    exclude 'assets/**/*.less'
    exclude 'assets/**/tsconfig.tsbuildinfo'

    outputs.dir "${buildDir}/resources/main"

    dependsOn pnpmBuild
}

test {
    useJUnitPlatform()
    systemProperty 'java.awt.headless', 'true'
    jvmArgs '-noverify', '-XX:TieredStopAtLevel=1'
}

if ( hasProperty( 'env' ) )
{
    addBuildDependency()
}

def addBuildDependency() {
    if ( isLibAdminUiIncluded() )
    {
        def libAdminBuildTask = gradle.includedBuild( 'lib-admin-ui' ).task( ':build' )
        copyDevResources.dependsOn += libAdminBuildTask
        build.dependsOn += libAdminBuildTask
        clean.dependsOn += gradle.includedBuild( 'lib-admin-ui' ).task( ':clean' )
        flush.dependsOn += gradle.includedBuild( 'lib-admin-ui' ).task( ':flush' )
    }
}

def isLibAdminUiIncluded() {
    return new File( '../lib-admin-ui' ).exists()
}

def nodeEnvironment() {
    def environments = [ prod : 'production', dev: 'development' ]
    def nodeEnv = environments[hasProperty( 'env' ) ? env : 'prod']
    return nodeEnv != null ? nodeEnv : 'production'
}
